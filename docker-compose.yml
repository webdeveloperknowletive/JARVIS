version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis_crm
      POSTGRES_USER: jarvis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis_user -d jarvis_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jarvis_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
     command:
    - sh
    - -c
    - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers 
    container_name: jarvis_api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://jarvis_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@postgres:5432/jarvis_crm
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in your environment}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_uploads:/app/storage_uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jarvis_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info
       environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://jarvis_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@postgres:5432/jarvis_crm
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in your environment}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - storage_uploads:/app/storage_uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jarvis_frontend
    restart: unless-stopped
    depends_on:
      - backend

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jarvis_beat
    restart: unless-stopped
    command: celery -A app.worker.celery_app beat --loglevel=info
        environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://jarvis_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@postgres:5432/jarvis_crm
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in your environment}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage_uploads:
